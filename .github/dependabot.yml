version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: cron
      cronjob: "0 1 * * *"
    cooldown:
      default-days: 0
    groups:
      nix-flake-inputs:
        patterns:
          - "*"
